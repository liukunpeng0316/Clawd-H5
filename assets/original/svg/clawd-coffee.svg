<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* Body: gentle sway */
      .body-sway {
        transform-origin: 7.5px 15px;
        animation: sway 5s infinite ease-in-out;
      }

      /* Right arm: reach up → grab → bring down → sip → bring up → release → return */
      .arm-r-move {
        animation: arm-grab 5s infinite ease-in-out;
      }

      /* Cup on head: visible when arm is at side */
      .cup-head {
        animation: cup-head-vis 5s infinite;
      }

      /* Cup in hand: visible when arm is holding it */
      .cup-hand {
        animation: cup-hand-vis 5s infinite;
      }

      /* Normal eyes */
      .eyes-normal {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: eyes-normal-vis 5s infinite;
      }

      /* Happy eyes (during sip) */
      .eyes-happy {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: eyes-happy-vis 5s infinite;
      }

      /* Shadow */
      .shadow-anim {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadow-breathe 5s infinite ease-in-out;
      }

      /* Steam: only visible when cup is on head */
      .steam { opacity: 0; }
      .steam-1 { animation: steam-float 2s infinite ease-out; }
      .steam-2 { animation: steam-float 2s 0.7s infinite ease-out; }
      .steam-3 { animation: steam-float 2s 1.4s infinite ease-out; }

      /* Text wave animation */
      .py { animation: text-pulse 1s infinite ease-in-out; }
      .py0 { animation-delay: 0s; }
      .py1 { animation-delay: 0.1s; }
      .py2 { animation-delay: 0.2s; }
      .py3 { animation-delay: 0.3s; }
      .py4 { animation-delay: 0.4s; }
      .py5 { animation-delay: 0.5s; }
      .py6 { animation-delay: 0.6s; }

      /* --- Keyframes --- */

      @keyframes sway {
        0%, 100% { transform: scale(1, 1) translate(0, 0); }
        50%      { transform: scale(1.02, 0.98) translate(0, 0.5px); }
      }

      /*
        Arm motion (5s cycle):
        0-18%:   at side
        18-28%:  reach up to head (grab cup)
        28-38%:  bring cup down to face
        38-58%:  hold at face (sipping)
        58-68%:  bring cup back up to head
        68-78%:  release cup, return to side
        78-100%: at side
      */
      @keyframes arm-grab {
        0%, 18%   { transform: translate(0, 0); }
        28%       { transform: translate(-6px, -5px); }
        38%       { transform: translate(-3.5px, 2px); }
        58%       { transform: translate(-3.5px, 2px); }
        68%       { transform: translate(-6px, -5px); }
        78%       { transform: translate(0, 0); }
        100%      { transform: translate(0, 0); }
      }

      /* Cup on head: visible when not in hand */
      @keyframes cup-head-vis {
        0%, 24%   { opacity: 1; }
        26%       { opacity: 0; }
        66%       { opacity: 0; }
        68%       { opacity: 1; }
        100%      { opacity: 1; }
      }

      /* Cup in hand: visible when grabbed */
      @keyframes cup-hand-vis {
        0%, 24%   { opacity: 0; }
        26%       { opacity: 1; }
        66%       { opacity: 1; }
        68%       { opacity: 0; }
        100%      { opacity: 0; }
      }

      /*
        Eyes: normal when cup on head, happy during sip
        Blink transitions at 28-32% and 58-62%
      */
      @keyframes eyes-normal-vis {
        0%        { opacity: 1; transform: scaleY(1); }
        30%       { opacity: 1; transform: scaleY(1); }
        32%       { opacity: 1; transform: scaleY(0.05); }
        32.5%     { opacity: 0; transform: scaleY(0.05); }
        60%       { opacity: 0; transform: scaleY(0.05); }
        60.5%     { opacity: 1; transform: scaleY(0.05); }
        62%       { opacity: 1; transform: scaleY(1); }
        100%      { opacity: 1; transform: scaleY(1); }
      }

      @keyframes eyes-happy-vis {
        0%        { opacity: 0; transform: scaleY(0.05); }
        34%       { opacity: 0; transform: scaleY(0.05); }
        34.5%     { opacity: 1; transform: scaleY(0.05); }
        36%       { opacity: 1; transform: scaleY(1); }
        56%       { opacity: 1; transform: scaleY(1); }
        58%       { opacity: 1; transform: scaleY(0.05); }
        58.5%     { opacity: 0; transform: scaleY(0.05); }
        100%      { opacity: 0; transform: scaleY(0.05); }
      }

      @keyframes steam-float {
        0%   { transform: translate(0, 0) scale(0.5); opacity: 0; }
        15%  { opacity: 0.8; }
        100% { transform: translate(0, -5px) scale(1.3); opacity: 0; }
      }

      @keyframes text-pulse {
        0%, 100% { opacity: 0.15; }
        50% { opacity: 1; }
      }

      @keyframes shadow-breathe {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50%      { transform: scale(1.02); opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs -->
  <g fill="#DE886D">
    <rect x="3" y="13" width="1" height="2"/>
    <rect x="5" y="13" width="1" height="2"/>
    <rect x="9" y="13" width="1" height="2"/>
    <rect x="11" y="13" width="1" height="2"/>
  </g>

  <!-- JAVA... text above head -->
  <text x="10" y="2" text-anchor="middle" font-family="monospace" font-size="2.4" font-weight="bold" letter-spacing="0.1">
    <tspan class="py py0" fill="#F44336">J</tspan><tspan class="py py1" fill="#FF9800">A</tspan><tspan class="py py2" fill="#2196F3">V</tspan><tspan class="py py3" fill="#F44336">A</tspan><tspan class="py py4" fill="#FFFFFF">.</tspan><tspan class="py py5" fill="#FFFFFF">.</tspan><tspan class="py py6" fill="#FFFFFF">.</tspan>
  </text>

  <!-- Body -->
  <g class="body-sway">

    <!-- === Torso === -->
    <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

    <!-- === Cup on head (static position, opacity controlled) === -->
    <g class="cup-head">
      <rect x="8" y="4" width="0.8" height="1.5" rx="0.4" fill="none" stroke="#CCCCCC" stroke-width="0.5"/>
      <rect x="5" y="3.5" width="3" height="2.5" rx="0.2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.3"/>
      <rect x="5.3" y="3.5" width="2.4" height="0.8" rx="0.1" fill="#5D4037"/>
      <!-- Steam on head -->
      <rect class="steam steam-1" x="5.3" y="2.5" width="1" height="1" rx="0.5" fill="#AAAAAA"/>
      <rect class="steam steam-2" x="6.3" y="2.3" width="0.9" height="0.9" rx="0.45" fill="#BBBBBB"/>
      <rect class="steam steam-3" x="7.2" y="2.5" width="0.85" height="0.85" rx="0.4" fill="#AAAAAA"/>
    </g>

    <!-- === Eyes === -->
    <g class="eyes-normal" fill="#000000">
      <rect x="4" y="8" width="1" height="2"/>
      <rect x="10" y="8" width="1" height="2"/>
    </g>
    <g class="eyes-happy" fill="none" stroke="#000000" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" opacity="0">
      <polyline points="3.5,9.5 4.5,8 5.5,9.5"/>
      <polyline points="9.5,9.5 10.5,8 11.5,9.5"/>
    </g>

    <!-- === Left arm (static at side) === -->
    <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>

    <!-- === Right arm + cup in hand (animated) === -->
    <g class="arm-r-move">
      <!-- Cup in hand (opacity controlled, drawn before arm) -->
      <g class="cup-hand" opacity="0">
        <rect x="13" y="9" width="0.8" height="1.5" rx="0.4" fill="none" stroke="#CCCCCC" stroke-width="0.5"/>
        <rect x="10.5" y="8.5" width="3" height="2.5" rx="0.2" fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.3"/>
        <rect x="10.8" y="8.5" width="2.4" height="0.8" rx="0.1" fill="#5D4037"/>
      </g>
      <!-- Arm shadow + arm -->
      <rect x="13.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.2"/>
      <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    </g>
  </g>
</svg>
