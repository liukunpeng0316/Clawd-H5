<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Sick animation: 4s cycle.
        Clawd is unwell — body shivers, eyes droop,
        cross bandage on head, small sweat drops.
      */

      /* Body: shiver + slight sway */
      .body-sick {
        transform-origin: 7.5px 15px;
        animation: sick-shiver 4s infinite ease-in-out;
      }

      /* Eyes: tired, half-closed with slow drift */
      .eyes-sick {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: eyes-tired 4s infinite ease-in-out;
      }

      /* Arms hang limply */
      .arm-l-limp {
        transform-origin: 2px 10px;
        transform: translate(0, 1px) rotate(-10deg);
      }
      .arm-r-limp {
        transform-origin: 13px 10px;
        transform: translate(0, 1px) rotate(10deg);
      }

      /* Shadow syncs with shiver */
      .shadow-sick {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadow-sick 4s infinite ease-in-out;
      }

      /* Sweat drops float up-left and fade */
      .sweat-1 {
        animation: sweat-float 4s infinite ease-out;
      }
      .sweat-2 {
        animation: sweat-float 4s infinite ease-out 1.8s;
      }

      /* Legs: unsteady stumble — outer vs inner alternating translateY */
      .legs-outer {
        transform-box: fill-box;
        transform-origin: 50% 0%;
        animation: leg-outer-stumble 4s infinite ease-in-out;
      }
      .legs-inner {
        transform-box: fill-box;
        transform-origin: 50% 0%;
        animation: leg-inner-stumble 4s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      @keyframes sick-shiver {
        0%, 100% { transform: scale(1.04, 0.96) translate(0, 0.5px) rotate(0deg); }
        15%      { transform: scale(1.04, 0.96) translate(-0.8px, 0.3px) rotate(-2.5deg); }
        30%      { transform: scale(1.05, 0.95) translate(0.3px, 0.6px) rotate(0.5deg); }
        50%      { transform: scale(1.04, 0.96) translate(0.8px, 0.3px) rotate(2.5deg); }
        65%      { transform: scale(1.05, 0.95) translate(-0.3px, 0.6px) rotate(-0.5deg); }
        80%      { transform: scale(1.04, 0.96) translate(-0.5px, 0.4px) rotate(-1.5deg); }
      }

      @keyframes eyes-tired {
        0%, 100% { transform: scaleY(0.5); }
        25%      { transform: scaleY(0.3); }
        50%      { transform: scaleY(0.55); }
        75%      { transform: scaleY(0.2); }
      }

      @keyframes shadow-sick {
        0%, 100% { transform: scaleX(1); opacity: 0.5; }
        50%      { transform: scaleX(1.04); opacity: 0.5; }
      }

      @keyframes sweat-float {
        0%       { transform: translate(0, 0); opacity: 0; }
        10%      { opacity: 0.7; }
        60%      { transform: translate(-2px, -3px); opacity: 0.5; }
        100%     { transform: translate(-3px, -5px); opacity: 0; }
      }

      @keyframes leg-outer-stumble {
        0%, 100% { transform: translateY(0); }
        20%      { transform: translateY(-1.5px); }
        40%      { transform: translateY(0); }
        65%      { transform: translateY(-1px); }
        80%      { transform: translateY(0); }
      }

      @keyframes leg-inner-stumble {
        0%, 100% { transform: translateY(0); }
        10%      { transform: translateY(0); }
        35%      { transform: translateY(-1.2px); }
        50%      { transform: translateY(0); }
        75%      { transform: translateY(-1.5px); }
        90%      { transform: translateY(0); }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-sick" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs (outer x=3,11 vs inner x=5,9 alternating) -->
  <g fill="#DE886D">
    <!-- Outer pair -->
    <g class="legs-outer">
      <rect x="3" y="12" width="1" height="3"/>
      <rect x="11" y="12" width="1" height="3"/>
    </g>
    <!-- Inner pair -->
    <g class="legs-inner">
      <rect x="5" y="12" width="1" height="3"/>
      <rect x="9" y="12" width="1" height="3"/>
    </g>
  </g>

  <!-- Upper body (shivers) -->
  <g class="body-sick">

    <!-- === Torso === -->
    <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

    <!-- === Eyes (tired, half-closed) === -->
    <g class="eyes-sick" fill="#000000">
      <rect x="3.5" y="8.5" width="1.5" height="1.5"/>
      <rect x="10" y="8.5" width="1.5" height="1.5"/>
    </g>

    <!-- === Left arm (limp) === -->
    <g class="arm-l-limp">
      <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
    </g>

    <!-- === Right arm (limp) === -->
    <g class="arm-r-limp">
      <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    </g>

    <!-- === Cross bandage on head (top-right, flush on surface) === -->
    <g transform="translate(9, 5.5)">
      <!-- Diagonal strip 1: top-left to bottom-right -->
      <rect x="0" y="0" width="3.5" height="0.9" rx="0.2"
            fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.15"
            transform="rotate(45, 1.75, 0.45)"/>
      <!-- Diagonal strip 2: top-right to bottom-left -->
      <rect x="0" y="0" width="3.5" height="0.9" rx="0.2"
            fill="#FFFFFF" stroke="#CCCCCC" stroke-width="0.15"
            transform="rotate(-45, 1.75, 0.45)"/>
      <!-- Center pad -->
      <rect x="1.25" y="-0.05" width="1" height="1" rx="0.2" fill="#F5F5F5"/>
    </g>

    <!-- === Fever blush (red diagonal lines across nose/center) === -->
    <g opacity="0.6">
      <!-- Center nose blush lines spanning across -->
      <line x1="5.5" y1="9.5" x2="6.5" y2="10.5" stroke="#E84040" stroke-width="0.4" stroke-linecap="round"/>
      <line x1="6.3" y1="9.5" x2="7.3" y2="10.5" stroke="#E84040" stroke-width="0.4" stroke-linecap="round"/>
      <line x1="7.1" y1="9.5" x2="8.1" y2="10.5" stroke="#E84040" stroke-width="0.4" stroke-linecap="round"/>
      <line x1="7.9" y1="9.5" x2="8.9" y2="10.5" stroke="#E84040" stroke-width="0.4" stroke-linecap="round"/>
      <line x1="8.7" y1="9.5" x2="9.7" y2="10.5" stroke="#E84040" stroke-width="0.4" stroke-linecap="round"/>
    </g>

    <!-- === Sweat drops === -->
    <g fill="#87CEEB">
      <circle class="sweat-1" cx="1" cy="5" r="0.5" opacity="0"/>
      <circle class="sweat-2" cx="13" cy="4" r="0.4" opacity="0"/>
    </g>

  </g>

</svg>
