<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Drowsy animation: 6s cycle.
        Clawd fights sleep — eyes droop, head nods forward,
        then snaps back up, repeat.
      */

      /* Body: slow breathing + periodic nod forward (dozing off) */
      .body-drowsy {
        transform-origin: 7.5px 15px;
        animation: drowsy-nod 6s infinite ease-in-out;
      }

      /* Eyes: slowly close then snap open */
      .eyes-drowsy {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: eyes-droop 6s infinite ease-in-out;
      }

      /* Arms relaxed, slight droop */
      .arm-l-relax {
        transform-origin: 2px 10px;
        transform: translate(0, 1px) rotate(-15deg);
      }
      .arm-r-relax {
        transform-origin: 13px 10px;
        transform: translate(0, 1px) rotate(15deg);
      }

      /* Shadow */
      .shadow-drowsy {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadow-breathe 6s infinite ease-in-out;
      }


      /* --- Keyframes --- */

      /* Continuous drowsy breathing: slow, heavy, squashed */
      @keyframes drowsy-nod {
        0%, 100%  { transform: scale(1.06, 0.94) translate(0, 0.8px); }
        50%       { transform: scale(1.09, 0.91) translate(0, 1.5px); }
      }

      /* Eyes: wider but still droopy, drifting between half-open and shut */
      @keyframes eyes-droop {
        0%, 100%  { transform: scaleY(0.6); }
        30%       { transform: scaleY(0.25); }
        50%       { transform: scaleY(0.55); }
        80%       { transform: scaleY(0.2); }
      }

      /* Low battery: blink red segment */
      .battery {
        animation: battery-blink 2s infinite;
      }
      @keyframes battery-blink {
        0%, 40%   { opacity: 1; }
        50%, 90%  { opacity: 0.2; }
        100%      { opacity: 1; }
      }


      @keyframes shadow-breathe {
        0%, 56%   { transform: scale(1); opacity: 0.5; }
        45%       { transform: scaleX(1.06); opacity: 0.5; }
        100%      { transform: scale(1); opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-drowsy" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs (extended, static) -->
  <g fill="#DE886D">
    <rect x="3" y="12" width="1" height="3"/>
    <rect x="5" y="12" width="1" height="3"/>
    <rect x="9" y="12" width="1" height="3"/>
    <rect x="11" y="12" width="1" height="3"/>
  </g>

  <!-- Upper body -->
  <g class="body-drowsy">

    <!-- === Torso === -->
    <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

    <!-- === Eyes (drooping) === -->
    <g class="eyes-drowsy" fill="#000000">
      <rect x="3.5" y="8.5" width="1.5" height="1.5"/>
      <rect x="10" y="8.5" width="1.5" height="1.5"/>
    </g>

    <!-- === Left arm (relaxed droop) === -->
    <g class="arm-l-relax">
      <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
    </g>

    <!-- === Right arm (relaxed droop) === -->
    <g class="arm-r-relax">
      <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    </g>

    <!-- === Zzz particles (staggered, float from head top-right) === -->
    <!-- Low battery icon (centered above head) -->
    <!--
      Battery: 5x3 body + 1x1 terminal nub on right.
      Centered at x=7.5, y=3. One red bar = low power.
    -->
    <g transform="translate(4.5, 1.5)">
      <!-- Battery outline -->
      <rect x="0" y="0" width="5" height="3" rx="0.3" fill="none" stroke="#888888" stroke-width="0.4"/>
      <!-- Terminal nub -->
      <rect x="5" y="0.8" width="0.8" height="1.4" rx="0.2" fill="#888888"/>
      <!-- Red low-power bar (blinks) -->
      <rect class="battery" x="0.6" y="0.6" width="1" height="1.8" rx="0.15" fill="#F44336"/>
    </g>

  </g>

</svg>
