<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* === Body: slight forward lean + thoughtful nod === */
      .body-lean {
        transform-origin: 7.5px 15px;
        animation: nod 2.4s infinite ease-in-out;
      }

      /* === Left arm: hold position (static translate, tiny pulse) === */
      .arm-l-hold {
        animation: hold-pulse 2.4s infinite ease-in-out;
      }

      /* === Right arm + pencil: writing strokes === */
      .arm-r-write {
        animation: write-stroke 0.35s infinite ease-in-out;
      }

      /* === Eyes: focused squint + reading scan === */
      .eyes-focus {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: eye-scan 3.2s infinite step-end;
      }

      /* === Eye blink overlay === */
      .eyes-blink {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: blink 3.2s infinite linear;
      }

      /* === Ink splatter particles === */
      .ink-dot {
        opacity: 0;
        animation: ink-splash 0.7s infinite ease-out;
      }

      /* === Written text lines appearing on notepad === */
      .text-line {
        animation: write-text 4.8s infinite step-end;
      }

      /* === Shadow === */
      .shadow-pulse {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadow-breathe 2.4s infinite ease-in-out;
      }

      /* ---------- Keyframes ---------- */

      @keyframes nod {
        0%, 100% { transform: translateY(0); }
        30%      { transform: translateY(0.5px); }
        50%      { transform: translateY(-0.3px); }
        70%      { transform: translateY(0.5px); }
      }

      /* Left arm: translate to front-left of notepad, tiny grip pulse */
      @keyframes hold-pulse {
        0%, 100% { transform: translate(3px, 1px); }
        50%      { transform: translate(3px, 1.3px); }
      }

      /* Right arm + pencil: writing micro-strokes near notepad */
      @keyframes write-stroke {
        0%       { transform: translate(-5px, 1px); }
        25%      { transform: translate(-5px, 0.4px); }
        50%      { transform: translate(-4.6px, 1.2px); }
        75%      { transform: translate(-4.6px, 0.6px); }
        100%     { transform: translate(-5px, 1px); }
      }

      /* Eyes: squinted (scaleY 0.7) + looking down at notepad + scan */
      @keyframes eye-scan {
        0%, 20%   { transform: translate(0px, 0.5px) scaleY(0.7); }
        20%, 45%  { transform: translate(0.5px, 0.5px) scaleY(0.7); }
        45%, 55%  { transform: translate(-0.5px, 0.5px) scaleY(0.7); }
        55%, 75%  { transform: translate(0px, 0.5px) scaleY(0.7); }
        75%, 85%  { transform: translate(0px, 0) scaleY(0.8); }
        85%, 100% { transform: translate(0px, 0.5px) scaleY(0.7); }
      }

      @keyframes blink {
        0%, 36%, 42%, 100% { transform: scaleY(1); }
        38%, 40%            { transform: scaleY(0.1); }
      }

      @keyframes ink-splash {
        0%   { opacity: 0; transform: translate(0, 0) scale(1); }
        15%  { opacity: 0.6; transform: translate(0, 0) scale(1); }
        100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0.3); }
      }

      @keyframes write-text {
        0%, 15%   { opacity: 0; }
        15%, 40%  { opacity: 0.35; }
        40%, 65%  { opacity: 0.55; }
        65%, 90%  { opacity: 0.75; }
        90%, 100% { opacity: 0; }
      }

      @keyframes shadow-breathe {
        0%, 100% { transform: scale(1); opacity: 0.5; }
        50%      { transform: scale(1.03); opacity: 0.55; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-pulse" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Main Character Group (leaning forward) -->
  <g class="body-lean">

    <!-- === Layer 1: Legs + Torso === -->
    <g fill="#DE886D">
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/>
      <rect x="11" y="13" width="1" height="2"/>
      <rect x="2" y="6" width="11" height="7"/>
    </g>

    <!-- === Layer 2: Eyes (focused squint, looking down) === -->
    <g class="eyes-blink">
      <g class="eyes-focus" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>
    </g>

    <!-- === Layer 3: Left arm (behind notepad, holding it) === -->
    <!--
      Left arm original: (0, 9) 2x2
      translate(3px, 1px) → global (3, 10) 2x2, x: 3-5, y: 10-12
      Below eyes (y=8-10), safe ✓
    -->
    <g class="arm-l-hold">
      <!-- Shadow: bottom-right offset, rendered BEFORE arm so arm covers it -->
      <rect x="0.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.2"/>
      <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
    </g>

    <!-- === Layer 4: Notepad SIDE VIEW (sandwiched between arms) === -->
    <!--
      Side view of open notepad held flat:
      Top: open page surface (cream, with text) — we look down onto it
      Middle: page edges (stacked white pages visible from side)
      Bottom: back cover (darker)
      Global x: 3.5-8.5, y: 10.5-12.8
    -->
    <!--
      Notepad SIDE VIEW — thinner, lower position
      Open page:  y: 12.0-12.6
      Page stack:  y: 12.6-12.9
      Back cover:  y: 12.9-13.2
      Total thickness: 1.2 units
    -->
    <g id="notepad">
      <!-- Back cover (bottom, darker brown) -->
      <rect x="3.8" y="12.9" width="5.4" height="0.3" fill="#8D6E63"/>

      <!-- Page stack edges (side view: stacked paper) -->
      <rect x="3.6" y="12.6" width="5.8" height="0.3" fill="#FAFAFA"/>
      <line x1="3.7" y1="12.7" x2="9.3" y2="12.7" stroke="#DDD" stroke-width="0.1"/>
      <line x1="3.7" y1="12.85" x2="9.3" y2="12.85" stroke="#DDD" stroke-width="0.1"/>

      <!-- Open page surface (top, we look down onto it) -->
      <rect x="3.5" y="12" width="6" height="0.6" fill="#FAFAF5" rx="0.1"/>
      <rect x="3.5" y="12" width="6" height="0.6" fill="none" stroke="#BDBDBD" stroke-width="0.15" rx="0.1"/>

      <!-- Written text on open page -->
      <g class="text-line">
        <line x1="4" y1="12.15" x2="7" y2="12.15" stroke="#444" stroke-width="0.15" stroke-linecap="round"/>
        <line x1="4" y1="12.35" x2="8.5" y2="12.35" stroke="#444" stroke-width="0.15" stroke-linecap="round"/>
        <line x1="4" y1="12.5" x2="6.2" y2="12.5" stroke="#444" stroke-width="0.15" stroke-linecap="round"/>
      </g>
    </g>

    <!-- === Layer 5: Right arm + Pencil (on top of notepad, writing) === -->
    <!--
      Right arm original: (13, 9) 2x2
      translate(-5px, 1px) → global (8, 10) 2x2, x: 8-10, y: 10-12
      Below eyes (y=8-10), safe ✓
      Pencil in same group: moves together with arm
      Pencil local: x=12.3, y=10.5, 0.6x2.2 → global (7.3, 11.5) tip at ~y=13.5
    -->
    <g class="arm-r-write">
      <!-- Shadow: bottom-right offset, rendered first (bottom layer) -->
      <rect x="13.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.2"/>

      <!-- Pencil: rendered BEFORE arm so arm covers the grip area -->
      <!--
        Pencil local center x=13.5, grip at (13.5, 9.5)
        After translate(-5, 1): grip global ≈ (8.5, 10.5), tip extends toward notepad
      -->
      <g transform="rotate(25, 13, 9.5)">
        <!-- Eraser (pink) -->
        <rect x="12.7" y="8.2" width="0.6" height="0.4" fill="#F48FB1" rx="0.1"/>
        <!-- Metal ferrule -->
        <rect x="12.6" y="8.55" width="0.8" height="0.25" fill="#BDBDBD"/>
        <!-- Pencil body (yellow) -->
        <rect x="12.7" y="8.8" width="0.6" height="1.8" fill="#FDD835"/>
        <!-- Pencil tip (dark graphite) -->
        <polygon points="12.7,10.6 13.3,10.6 13,11.1" fill="#555"/>
      </g>

      <!-- Arm: rendered AFTER pencil, covers pencil grip area -->
      <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    </g>

    <!-- === Layer 6: Ink splatter near pencil tip === -->
    <!--
      Pencil tip global ≈ (7.6, 12.8)
      Ink dots near that position
    -->
    <!-- Ink dots near pencil tip (global ≈ 7.3, 12.0) -->
    <g fill="#444">
      <rect class="ink-dot" x="6.8" y="11.7" width="0.4" height="0.4" style="--dx: -1.5px; --dy: -1px;"/>
      <rect class="ink-dot" x="7.6" y="11.9" width="0.35" height="0.35" style="--dx: 1.2px; --dy: -0.8px; animation-delay: 0.25s;"/>
      <rect class="ink-dot" x="7.2" y="11.5" width="0.3" height="0.3" style="--dx: -0.8px; --dy: 1px; animation-delay: 0.5s;"/>
    </g>
  </g>
</svg>
