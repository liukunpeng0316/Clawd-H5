<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* Outer layer: rapid micro-tremble for whole body */
      .tremble {
        transform-origin: 7.5px 15px;
        animation: body-tremble 0.12s infinite linear;
      }

      /* Inner layer: slower hunch/tense */
      .hunch {
        transform-origin: 7.5px 15px;
        animation: body-hunch 1.5s infinite ease-in-out;
      }

      /* Eyes: angry squint */
      .eyes-fury {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: eyes-angry 3s infinite;
      }

      /* Arms tremble independently */
      .arm-l { animation: arm-tremble-l 0.1s infinite linear; }
      .arm-r { animation: arm-tremble-r 0.1s infinite linear; }

      /* Stomp legs: outer pair vs inner pair */
      .legs-outer {
        animation: stomp-outer 0.7s infinite ease-out;
      }
      .legs-inner {
        animation: stomp-inner 0.7s infinite ease-out;
      }

      /* Face flush */
      .face-flush {
        animation: flush-pulse 0.8s infinite ease-in-out;
      }

      /* Shadow */
      .shadow-fury {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadow-tremble 0.12s infinite linear;
      }

      /* Flame particles */
      .flame-1 { opacity: 0; animation: flame-a 0.6s infinite ease-out; }
      .flame-2 { opacity: 0; animation: flame-b 0.6s infinite ease-out 0.15s; }
      .flame-3 { opacity: 0; animation: flame-c 0.6s infinite ease-out 0.3s; }
      .flame-4 { opacity: 0; animation: flame-a 0.5s infinite ease-out 0.1s; }
      .flame-5 { opacity: 0; animation: flame-b 0.5s infinite ease-out 0.25s; }
      .flame-6 { opacity: 0; animation: flame-c 0.5s infinite ease-out 0.4s; }


      /* --- Keyframes --- */

      @keyframes body-tremble {
        0%   { transform: translate(0.1px, 0); }
        25%  { transform: translate(-0.1px, 0.08px); }
        50%  { transform: translate(0.08px, -0.08px); }
        75%  { transform: translate(-0.08px, 0.05px); }
        100% { transform: translate(0.1px, 0); }
      }

      @keyframes body-hunch {
        0%, 100% { transform: scale(1.02, 0.96) translateY(0.5px); }
        50%      { transform: scale(1.04, 0.94) translateY(1px); }
      }

      @keyframes eyes-angry {
        0%, 88%  { transform: scaleY(0.6); }
        91%      { transform: scaleY(0.05); }
        94%      { transform: scaleY(0.6); }
        100%     { transform: scaleY(0.6); }
      }

      @keyframes arm-tremble-l {
        0%   { transform: translate(0.2px, 0); }
        50%  { transform: translate(-0.2px, 0.15px); }
        100% { transform: translate(0.2px, 0); }
      }
      @keyframes arm-tremble-r {
        0%   { transform: translate(-0.2px, 0.1px); }
        50%  { transform: translate(0.2px, -0.1px); }
        100% { transform: translate(-0.2px, 0.1px); }
      }

      /* Outer legs (x=3,11) stomp: first half */
      @keyframes stomp-outer {
        0%       { transform: translateY(0); }
        8%       { transform: translateY(-1.5px); }
        20%      { transform: translateY(0.3px); }
        28%      { transform: translateY(0); }
        100%     { transform: translateY(0); }
      }

      /* Inner legs (x=5,9) stomp: second half */
      @keyframes stomp-inner {
        0%, 50%  { transform: translateY(0); }
        58%      { transform: translateY(-1.5px); }
        70%      { transform: translateY(0.3px); }
        78%      { transform: translateY(0); }
        100%     { transform: translateY(0); }
      }

      @keyframes flush-pulse {
        0%, 100% { opacity: 0.08; }
        50%      { opacity: 0.38; }
      }

      @keyframes shadow-tremble {
        0%   { transform: translate(0.2px, 0); }
        50%  { transform: translate(-0.2px, 0); }
        100% { transform: translate(0.2px, 0); }
      }

      /* Flame: rise from head, shrink and fade */
      @keyframes flame-a {
        0%   { transform: translateY(0) scale(1); opacity: 0.9; }
        100% { transform: translateY(-5px) scale(0.3); opacity: 0; }
      }
      @keyframes flame-b {
        0%   { transform: translateY(0) scale(0.9); opacity: 0.85; }
        100% { transform: translateY(-4.5px) scale(0.2); opacity: 0; }
      }
      @keyframes flame-c {
        0%   { transform: translateY(0) scale(0.8); opacity: 0.8; }
        100% { transform: translateY(-5.5px) scale(0.25); opacity: 0; }
      }

    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-fury" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>


  <!-- Outer: whole body trembles together -->
  <g class="tremble">
    <!-- Inner: hunch/tense -->
    <g class="hunch">

      <!-- Legs: outer pair -->
      <g class="legs-outer" fill="#DE886D">
        <rect x="3" y="12" width="1" height="3"/>
        <rect x="11" y="12" width="1" height="3"/>
      </g>
      <!-- Legs: inner pair -->
      <g class="legs-inner" fill="#DE886D">
        <rect x="5" y="12" width="1" height="3"/>
        <rect x="9" y="12" width="1" height="3"/>
      </g>

      <!-- Torso -->
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

      <!-- Face flush overlay -->
      <rect class="face-flush" x="2" y="6" width="11" height="7" fill="#D32F2F"/>

      <!-- Eyes: angry squint -->
      <g class="eyes-fury" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>

      <!-- Left arm -->
      <g class="arm-l">
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>

      <!-- Right arm -->
      <g class="arm-r">
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>

      <!-- Flame particles above head -->
      <rect class="flame-1" x="4"   y="4" width="1.2" height="1.8" fill="#FF3D00"/>
      <rect class="flame-2" x="7"   y="3.5" width="1.4" height="2"   fill="#FF6D00"/>
      <rect class="flame-3" x="10"  y="4" width="1.2" height="1.8" fill="#FF3D00"/>
      <rect class="flame-4" x="5.5" y="3" width="1"   height="1.5" fill="#FFC107"/>
      <rect class="flame-5" x="8.5" y="3" width="1"   height="1.5" fill="#FF9800"/>
      <rect class="flame-6" x="6.5" y="4.5" width="0.8" height="1.2" fill="#FFC107"/>

    </g>
  </g>
</svg>
