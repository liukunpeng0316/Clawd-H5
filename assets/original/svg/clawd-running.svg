<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Running left-right: 4s full cycle
        0-45%:   run right (translate -4px → +4px, lean right)
        45-55%:  turn around
        55-95%:  run left (translate +4px → -4px, lean left)
        95-100%: turn around
      */
      .run-body {
        transform-origin: 7.5px 13px;
        animation: run-move 3s infinite ease-in-out;
      }

      /* Bounce: quick up-down with each step */
      .run-bounce {
        transform-origin: 7.5px 15px;
        animation: run-bounce 0.3s infinite ease-in-out;
      }

      /* Legs: outer pair (3,11) vs inner pair (5,9), vertical stepping */
      .leg-outer {
        animation: step-outer 0.3s infinite ease-in-out;
      }
      .leg-inner {
        animation: step-inner 0.3s infinite ease-in-out;
      }

      /* Arms: fast swing */
      .arm-l {
        transform-origin: 2px 10px;
        animation: arm-swing-a 0.3s infinite ease-in-out;
      }
      .arm-r {
        transform-origin: 13px 10px;
        animation: arm-swing-b 0.3s infinite ease-in-out;
      }

      /* Left arm turn: swings forward at left end (before running right) */
      .arm-l-turn {
        animation: arm-l-turn 3s infinite ease-in-out;
      }
      /* Right arm turn: swings forward at right end (before running left) */
      .arm-r-turn {
        animation: arm-r-turn 3s infinite ease-in-out;
      }

      /* Eyes: look toward run direction */
      .eyes-run {
        transform-origin: 7.5px 9px;
        animation: eyes-look 3s infinite ease-in-out;
      }

      /* Shadow follows body horizontally */
      .shadow-run {
        transform-origin: 7.5px 15.5px;
        animation: shadow-move 3s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      /* Main body horizontal movement + lean */
      @keyframes run-move {
        0%, 5%    { transform: translate(-4px, 0); }
        45%       { transform: translate(4px, 0); }
        50%       { transform: translate(4px, 0); }
        55%       { transform: translate(4px, 0); }
        95%       { transform: translate(-4px, 0); }
        100%      { transform: translate(-4px, 0); }
      }

      /* Small vertical bounce per step */
      @keyframes run-bounce {
        0%, 100% { transform: translateY(0); }
        25% { transform: translateY(-0.8px); }
        50% { transform: translateY(0); }
        75% { transform: translateY(-0.8px); }
      }

      /* Outer legs (3,11): up when inner down */
      @keyframes step-outer {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-1.5px); }
      }

      /* Inner legs (5,9): opposite phase */
      @keyframes step-inner {
        0%, 100% { transform: translateY(-1.5px); }
        50% { transform: translateY(0); }
      }

      /* Left arm: forward when running LEFT (55-95%), at side when running RIGHT */
      @keyframes arm-l-turn {
        0%, 45%   { transform: translate(0, 0); }
        55%       { transform: translate(3px, 1px); }    /* forward */
        92%       { transform: translate(3px, 1px); }
        100%      { transform: translate(0, 0); }
      }

      /* Right arm: forward when running RIGHT (5-45%), at side when running LEFT */
      @keyframes arm-r-turn {
        0%        { transform: translate(-3px, 1px); }
        5%        { transform: translate(-3px, 1px); }   /* forward */
        42%       { transform: translate(-3px, 1px); }
        50%       { transform: translate(0, 0); }
        100%      { transform: translate(0, 0); }
      }

      /* Left arm swing (synced with leg-b, opposite to leg-a) */
      @keyframes arm-swing-a {
        0%, 100% { transform: rotate(15deg); }
        50% { transform: rotate(-10deg); }
      }

      /* Right arm swing (opposite) */
      @keyframes arm-swing-b {
        0%, 100% { transform: rotate(-15deg); }
        50% { transform: rotate(10deg); }
      }

      /* Eyes look toward movement direction with parallax */
      @keyframes eyes-look {
        0%        { transform: translateX(1px) scaleY(1); }
        5%        { transform: translateX(1px) scaleY(1); }
        10%       { transform: translateX(1px) scaleY(0.7); }
        42%       { transform: translateX(1px) scaleY(0.7); }
        45%       { transform: translateX(1px) scaleY(1); }
        50%       { transform: translateX(0) scaleY(1); }
        55%       { transform: translateX(-1px) scaleY(1); }
        60%       { transform: translateX(-1px) scaleY(0.7); }
        92%       { transform: translateX(-1px) scaleY(0.7); }
        95%       { transform: translateX(-1px) scaleY(1); }
        100%      { transform: translateX(1px) scaleY(1); }
      }

      /* Shadow follows body */
      @keyframes shadow-move {
        0%, 5%    { transform: translateX(-4px) scaleX(0.9); opacity: 0.45; }
        45%       { transform: translateX(4px) scaleX(0.9); opacity: 0.45; }
        50%       { transform: translateX(4px) scaleX(1); opacity: 0.5; }
        55%       { transform: translateX(4px) scaleX(0.9); opacity: 0.45; }
        95%       { transform: translateX(-4px) scaleX(0.9); opacity: 0.45; }
        100%      { transform: translateX(-4px) scaleX(0.9); opacity: 0.45; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-run" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Full body: horizontal movement + lean -->
  <g class="run-body">
    <!-- Bounce layer -->
    <g class="run-bounce">

      <!-- Legs (fast alternating, below torso) -->
      <g fill="#DE886D">
        <rect class="leg-outer" x="3" y="11" width="1" height="4"/>
        <rect class="leg-inner" x="5" y="11" width="1" height="4"/>
        <rect class="leg-inner" x="9" y="11" width="1" height="4"/>
        <rect class="leg-outer" x="11" y="11" width="1" height="4"/>
      </g>

      <!-- Torso -->
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

      <!-- Eyes (look toward run direction) -->
      <g class="eyes-run" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>

      <!-- Arms (fast swing + turn forward + shadow) -->
      <g class="arm-l-turn">
        <g class="arm-l">
          <rect x="0.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.25"/>
          <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
        </g>
      </g>
      <g class="arm-r-turn">
        <g class="arm-r">
          <rect x="13.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.25"/>
          <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
        </g>
      </g>

    </g>
  </g>
</svg>
