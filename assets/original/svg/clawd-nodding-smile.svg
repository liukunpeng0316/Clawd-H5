<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* Breathing */
      .breathe {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }

      /* Nodding: body compresses downward */
      .nod {
        transform-origin: 7.5px 13px;
        animation: nod 2s infinite ease-in-out;
      }

      /* Normal eyes: visible at rest */
      .eyes-normal {
        transform-origin: 7.5px 9px;
        animation: eyes-normal-vis 2s infinite ease-in-out, eyes-nod-shift 2s infinite ease-in-out;
      }

      /* Smile eyes: visible during nodding */
      .eyes-smile {
        opacity: 0;
        animation: eyes-smile-vis 2s infinite ease-in-out, eyes-nod-shift 2s infinite ease-in-out;
      }

      /* Shadow syncs with nod */
      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: shadow-nod 2s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.3px); }
      }

      /* Two nods: compress body down then bounce back */
      @keyframes nod {
        0%, 20%, 100%  { transform: scale(1, 1) translateY(0); }
        30%, 34%       { transform: scale(1.03, 0.95) translateY(1px); }
        40%            { transform: scale(1, 1) translateY(0); }
        48%, 52%       { transform: scale(1.03, 0.95) translateY(1px); }
        60%            { transform: scale(1, 1) translateY(0); }
        70%            { transform: scale(1, 1) translateY(0); }
      }

      /* Normal eyes: visible at rest, blink to transition */
      @keyframes eyes-normal-vis {
        0%, 22%   { opacity: 1; }
        24%, 68%  { opacity: 0; }
        70%, 100% { opacity: 1; }
      }

      /* Smile eyes: visible during nodding */
      @keyframes eyes-smile-vis {
        0%, 26%   { opacity: 0; }
        28%, 64%  { opacity: 1; }
        66%, 100% { opacity: 0; }
      }

      /* Eyes vertical shift: subtle parallax for head bobbing feel */
      @keyframes eyes-nod-shift {
        0%, 20%, 100%  { transform: translateY(0); }
        30%, 34%       { transform: translateY(0.8px); }
        40%            { transform: translateY(-0.2px); }
        44%            { transform: translateY(0); }
        48%, 52%       { transform: translateY(0.8px); }
        60%            { transform: translateY(-0.2px); }
        64%            { transform: translateY(0); }
        70%            { transform: translateY(0); }
      }

      /* Shadow widens when body compresses */
      @keyframes shadow-nod {
        0%, 20%, 40%, 60%, 100% { transform: scaleX(1); opacity: 0.5; }
        30%, 34%  { transform: scaleX(1.06); opacity: 0.48; }
        48%, 52%  { transform: scaleX(1.06); opacity: 0.48; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs (static, extended) -->
  <g fill="#DE886D">
    <rect x="3" y="11" width="1" height="4"/>
    <rect x="5" y="11" width="1" height="4"/>
    <rect x="9" y="11" width="1" height="4"/>
    <rect x="11" y="11" width="1" height="4"/>
  </g>

  <!-- Upper body -->
  <g class="nod">
    <g class="breathe">
      <!-- Torso -->
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

      <!-- Normal eyes (visible at rest) -->
      <g class="eyes-normal" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>

      <!-- Smile ^^ eyes (visible during nodding) -->
      <g class="eyes-smile" fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3.5,9.5 4.5,8.5 5.5,9.5"/>
        <polyline points="9.5,9.5 10.5,8.5 11.5,9.5"/>
      </g>

      <!-- Arms (resting at sides) -->
      <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
    </g>
  </g>
</svg>
