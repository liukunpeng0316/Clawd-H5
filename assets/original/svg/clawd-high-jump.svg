<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /* === Character bounce === */
      .bounce {
        transform-box: fill-box;
        transform-origin: 50% 100%;
        animation: high-jump 1.4s infinite ease-in-out;
      }

      /* === Arms spread at peak === */
      .arm-l {
        transform-box: fill-box;
        transform-origin: 100% 50%;
        animation: arm-left 1.4s infinite ease-in-out;
      }
      .arm-r {
        transform-box: fill-box;
        transform-origin: 0% 50%;
        animation: arm-right 1.4s infinite ease-in-out;
      }

      /* === Happy eyes ^^ === */
      .eyes-happy {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: eyes-squint 1.4s infinite ease-in-out;
      }

      /* === Shadow === */
      .shadow {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadow-shrink 1.4s infinite ease-in-out;
      }

      /* === Speed lines (ascent) === */
      .speed-lines {
        animation: speed-show 1.4s infinite ease-out;
      }

      /* === Impact stars (landing) === */
      .impact-l {
        animation: impact-burst 1.4s infinite ease-out;
      }
      .impact-r {
        animation: impact-burst 1.4s infinite ease-out 0.03s;
      }

      /* === Wind puff (launch) === */
      .puff {
        animation: puff-burst 1.4s infinite ease-out;
      }

      /* ---------- Keyframes ---------- */

      @keyframes high-jump {
        0%, 12%  { transform: translateY(0) scaleY(1); }
        18%      { transform: translateY(1px) scaleY(0.7); }       /* Deep squat */
        22%      { transform: translateY(0) scaleY(1.15); }        /* Launch stretch */
        38%      { transform: translateY(-24px) scaleY(1.08); }    /* Rising */
        46%, 52% { transform: translateY(-26px) scaleY(1); }       /* Peak hangtime */
        62%      { transform: translateY(-24px) scaleY(1.08); }    /* Falling stretch */
        78%      { transform: translateY(0) scaleY(0.72); }        /* Landing squash */
        85%      { transform: translateY(0) scaleY(1.05); }        /* Overshoot */
        92%      { transform: translateY(0) scaleY(0.97); }        /* Settle */
        100%     { transform: translateY(0) scaleY(1); }
      }

      @keyframes arm-left {
        0%, 12%  { transform: rotate(0deg); }
        18%      { transform: rotate(-10deg); }        /* Tucked in squat */
        30%      { transform: rotate(60deg); }
        46%, 52% { transform: rotate(85deg); }         /* Wide open at peak */
        70%      { transform: rotate(50deg); }
        78%      { transform: rotate(-15deg); }         /* Tuck on landing */
        92%, 100% { transform: rotate(0deg); }
      }

      @keyframes arm-right {
        0%, 12%  { transform: rotate(0deg); }
        18%      { transform: rotate(10deg); }
        30%      { transform: rotate(-60deg); }
        46%, 52% { transform: rotate(-85deg); }
        70%      { transform: rotate(-50deg); }
        78%      { transform: rotate(15deg); }
        92%, 100% { transform: rotate(0deg); }
      }

      @keyframes eyes-squint {
        0%, 15%  { transform: scaleY(1); }
        18%      { transform: scaleY(0.6); }            /* Effort squint */
        30%, 70% { transform: scaleY(1); }
        78%      { transform: scaleY(0.5); }             /* Landing squint */
        90%, 100% { transform: scaleY(1); }
      }

      @keyframes shadow-shrink {
        0%, 12%  { transform: scale(1); opacity: 0.5; }
        18%      { transform: scale(1.2); opacity: 0.6; }   /* Squat → wider shadow */
        30%      { transform: scale(0.5); opacity: 0.15; }
        46%, 52% { transform: scale(0.2); opacity: 0.06; }  /* Tiny at peak */
        62%      { transform: scale(0.5); opacity: 0.15; }
        78%      { transform: scale(1.3); opacity: 0.65; }  /* Impact spread */
        90%, 100% { transform: scale(1); opacity: 0.5; }
      }

      @keyframes speed-show {
        0%, 20%  { opacity: 0; }
        24%      { opacity: 0.6; }
        36%      { opacity: 0.3; }
        44%      { opacity: 0; }
        100%     { opacity: 0; }
      }

      @keyframes impact-burst {
        0%, 74%  { transform: scale(0); opacity: 0; }
        78%      { transform: scale(0.5); opacity: 1; }
        84%      { transform: scale(1.2); opacity: 0.6; }
        92%      { transform: scale(1.5); opacity: 0; }
        100%     { opacity: 0; }
      }

      @keyframes puff-burst {
        0%, 16%  { transform: translateY(0) scale(0); opacity: 0; }
        20%      { transform: translateY(0) scale(0.8); opacity: 0.5; }
        30%      { transform: translateY(3px) scale(1.5); opacity: 0.2; }
        40%      { transform: translateY(5px) scale(2); opacity: 0; }
        100%     { opacity: 0; }
      }
    </style>

    <!-- Pixel sparkle for impact -->
    <g id="px-star">
      <rect x="-0.5" y="-0.5" width="1" height="1"/>
      <rect x="-0.5" y="-1.5" width="1" height="1"/>
      <rect x="-0.5" y="0.5" width="1" height="1"/>
      <rect x="-1.5" y="-0.5" width="1" height="1"/>
      <rect x="0.5" y="-0.5" width="1" height="1"/>
    </g>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Launch puff cloud -->
  <g class="puff" fill="#000000" opacity="0">
    <rect x="4" y="14" width="2" height="1" rx="0.5" opacity="0.3"/>
    <rect x="7" y="13.5" width="2.5" height="1" rx="0.5" opacity="0.25"/>
    <rect x="10" y="14" width="1.5" height="1" rx="0.5" opacity="0.3"/>
  </g>

  <!-- Impact stars (landing) -->
  <g class="impact-l" fill="#FFC107" style="transform-origin: 1px 15px;">
    <use href="#px-star" x="1" y="14"/>
  </g>
  <g class="impact-r" fill="#FFC107" style="transform-origin: 14px 15px;">
    <use href="#px-star" x="14" y="14"/>
  </g>

  <!-- Speed lines (during ascent) -->
  <g class="speed-lines" stroke="#000000" stroke-width="0.4" stroke-linecap="round" opacity="0">
    <line x1="3" y1="8" x2="3" y2="13"/>
    <line x1="5.5" y1="9" x2="5.5" y2="14"/>
    <line x1="9.5" y1="9" x2="9.5" y2="14"/>
    <line x1="12" y1="8" x2="12" y2="13"/>
  </g>

  <!-- Main Character -->
  <g class="bounce">
    <g fill="#DE886D">
      <!-- Legs -->
      <rect x="3" y="13" width="1" height="2"/>
      <rect x="5" y="13" width="1" height="2"/>
      <rect x="9" y="13" width="1" height="2"/>
      <rect x="11" y="13" width="1" height="2"/>

      <!-- Torso -->
      <rect x="2" y="6" width="11" height="7"/>

      <!-- Arms -->
      <g class="arm-l">
        <rect x="0" y="9" width="2" height="2"/>
      </g>
      <g class="arm-r">
        <rect x="13" y="9" width="2" height="2"/>
      </g>
    </g>

    <!-- Eyes (happy ^^ at peak, normal otherwise) -->
    <g class="eyes-happy" fill="none" stroke="#000000" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3.5,9.5 4.5,8 5.5,9.5"/>
      <polyline points="9.5,9.5 10.5,8 11.5,9.5"/>
    </g>
  </g>
</svg>
