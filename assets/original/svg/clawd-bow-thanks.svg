<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Clawd bowing to say thank you.
        4s cycle: stand → bow down → hold → rise back → repeat
      */

      .breathe {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }

      /* Body bows forward (rotates around feet base) */
      .body-bow {
        transform-origin: 7.5px 15px;
        animation: body-bow 4s infinite ease-in-out;
      }

      /* Smile eyes ^^: visible at start and end */
      .eyes-smile {
        animation: eyes-smile-vis 4s infinite ease-in-out;
      }
      /* Normal eyes: visible from pre-bow through bow, gradually squint */
      .eyes-normal {
        transform-origin: 7.5px 9px;
        opacity: 0;
        animation: eyes-normal-vis 4s infinite ease-in-out, eyes-normal-transform 4s infinite ease-in-out;
      }

      /* Arms move to front and clasp during bow */
      .arm-l {
        animation: arm-l-bow 4s infinite ease-in-out;
      }
      .arm-r {
        animation: arm-r-bow 4s infinite ease-in-out;
      }

      /* Shadow widens when body leans forward */
      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: shadow-bow 4s infinite ease-in-out;
      }

      /* Big heart appears above head during bow */
      .big-heart {
        opacity: 0;
        animation: big-heart-vis 4s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1); }
        50%      { transform: scale(1.02, 0.98) translate(0, 0.3px); }
      }

      /*
        Timeline:
        0-15%:  standing upright
        15-20%: quick bow down (rotate forward + compress)
        20-50%: hold bow
        50-60%: rise back up
        60-100%: standing, breathing
      */
      /*
        Front-facing bow: body compresses vertically + widens (folding toward viewer).
        No rotation — just scaleY down + scaleX up + translateY down.
      */
      @keyframes body-bow {
        0%, 12%   { transform: translate(0, 0) scaleY(1) scaleX(1); }
        22%, 48%  { transform: translate(0, 0) scaleY(0.82); }
        60%, 100% { transform: translate(0, 0) scaleY(1) scaleX(1); }
      }

      /*
        Three-phase eye switching aligned to body-bow (12/22/48/60):
        0-6%:   smile ^^
        6-8%:   blink
        8-12%:  normal rect eyes (standing, about to bow)
        12-14%: blink (body starts moving)
        14-52%: bow eyes (covers full bow motion + hold)
        52-56%: blink (body rising)
        56-100%: smile ^^
      */
      @keyframes eyes-smile-vis {
        0%, 7%    { opacity: 1; }
        9%, 58%   { opacity: 0; }
        60%, 100% { opacity: 1; }
      }
      /* Normal eyes visible from 10% through bow+rise, blink out at 58% */
      @keyframes eyes-normal-vis {
        0%, 9%    { opacity: 0; }
        10%, 57%  { opacity: 1; }
        58%, 100% { opacity: 0; }
      }
      /*
        Normal eyes transform aligned to body-bow (12/22/48/60):
        10-12%: open (standing)
        12-22%: gradually squint + shift down (body bending)
        22-48%: hold squint (body fully bowed)
        48-60%: gradually open + shift up (body rising)
      */
      @keyframes eyes-normal-transform {
        0%, 12%   { transform: scaleY(1) translateY(0); }
        22%, 48%  { transform: scaleY(0.45) translateY(1.5px); }
        60%, 100% { transform: scaleY(1) translateY(0); }
      }

      /* Left arm: side → front mid-lower (clasped) during bow */
      @keyframes arm-l-bow {
        0%, 12%   { transform: translate(0, 0); }
        22%, 48%  { transform: translate(5px, 2px); }
        60%, 100% { transform: translate(0, 0); }
      }
      /* Right arm: side → front mid-lower (clasped) during bow */
      @keyframes arm-r-bow {
        0%, 12%   { transform: translate(0, 0); }
        22%, 48%  { transform: translate(-5px, 2px); }
        60%, 100% { transform: translate(0, 0); }
      }

      /* Shadow widens when body compresses forward */
      @keyframes shadow-bow {
        0%, 12%   { transform: scaleX(1); opacity: 0.5; }
        22%, 48%  { transform: scaleX(1.2); opacity: 0.55; }
        60%, 100% { transform: scaleX(1); opacity: 0.5; }
      }

      /* Big heart pops in during bow hold, fades on rise */
      @keyframes big-heart-vis {
        0%, 20%   { opacity: 0; transform: scale(0.3); }
        26%       { opacity: 1; transform: scale(1.1); }
        30%, 46%  { opacity: 1; transform: scale(1); }
        54%       { opacity: 0; transform: scale(0.8); }
        100%      { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Legs (static) -->
  <g fill="#DE886D">
    <rect x="3" y="11" width="1" height="4"/>
    <rect x="5" y="11" width="1" height="4"/>
    <rect x="9" y="11" width="1" height="4"/>
    <rect x="11" y="11" width="1" height="4"/>
  </g>

  <!-- Upper body (bows forward) -->
  <g class="body-bow">
    <g class="breathe">
      <!-- Torso -->
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

      <!-- Smile eyes ^^ (visible at start and end) -->
      <g class="eyes-smile" fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3.5,9.5 4.5,8 5.5,9.5"/>
        <polyline points="9.5,9.5 10.5,8 11.5,9.5"/>
      </g>

      <!-- Normal/bow eyes (one group: open → gradually squint during bow) -->
      <g class="eyes-normal" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>

      <!-- Left arm (moves to front during bow) -->
      <g class="arm-l">
        <rect x="0.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.2"/>
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>

      <!-- Right arm (moves to front during bow) -->
      <g class="arm-r">
        <rect x="13.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.2"/>
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
    </g>
  </g>

  <!-- Big pixel heart above head (appears during bow) -->
  <g transform="translate(7.5, 1.5)">
    <g class="big-heart">
      <!--
        Pixel heart: single filled polygon using absolute coordinates.
        Classic pixel heart shape, 0.8 unit grid.
      -->
      <polygon points="
        -2,-2.4  -0.4,-2.4  -0.4,-1.6  0.4,-1.6  0.4,-2.4  2,-2.4
        2,-1.6  2.8,-1.6  2.8,0  2,0  2,0.8  1.2,0.8  1.2,1.6
        0.4,1.6  0.4,2.4  -0.4,2.4  -0.4,1.6  -1.2,1.6  -1.2,0.8
        -2,0.8  -2,0  -2.8,0  -2.8,-1.6  -2,-1.6"
        fill="#F28B9E"/>
    </g>
  </g>
</svg>
