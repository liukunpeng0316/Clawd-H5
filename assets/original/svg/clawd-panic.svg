<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
<style>
  /* 全程180度倒立打滚 - 3s循环 */

  /* 左右缓慢滚动 */
  .roll-move {
    animation: roll-move 3s ease-in-out infinite;
  }
  @keyframes roll-move {
    0% { transform: translateX(0px); }
    50% { transform: translateX(-3px); }
    100% { transform: translateX(0px); }
  }

  /* 固定180度倒立 + 摇晃 */
  .fall-rotate {
    animation: fall-rotate 3s ease-in-out infinite;
    transform-origin: 10px 15px;
  }
  @keyframes fall-rotate {
    0% { transform: rotate(180deg); }
    25% { transform: rotate(184deg); }
    50% { transform: rotate(176deg); }
    75% { transform: rotate(184deg); }
    100% { transform: rotate(180deg); }
  }

  /* 位置补偿 - 180度倒立固定偏移 */
  .fall-compensate {
    transform: translate(-5px, -9px);
  }

  /* 颤抖 */
  .body-shake {
    animation: body-shake 0.12s linear infinite alternate;
  }
  @keyframes body-shake {
    0% { transform: translate(-0.2px, -0.3px); }
    100% { transform: translate(0.2px, 0.3px); }
  }

  /* 斗鸡眼 - 全程显示 */
  .x-eyes {
    animation: x-eyes-blink 2.5s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: center center;
  }
  @keyframes x-eyes-blink {
    0%, 44% { transform: scaleY(1); }
    47% { transform: scaleY(0.1); }
    53% { transform: scaleY(0.1); }
    56%, 100% { transform: scaleY(1); }
  }

  /* 腿部外侧 - 持续交替蹬腿 */
  .legs-kick-outer {
    animation: kick-outer 0.35s linear infinite;
    transform-box: fill-box;
    transform-origin: center bottom;
  }
  @keyframes kick-outer {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-2px); }
    100% { transform: translateY(0px); }
  }

  /* 腿部内侧 - 与外侧反相 */
  .legs-kick-inner {
    animation: kick-inner 0.35s linear infinite;
    transform-box: fill-box;
    transform-origin: center bottom;
  }
  @keyframes kick-inner {
    0% { transform: translateY(-2px); }
    50% { transform: translateY(0px); }
    100% { transform: translateY(-2px); }
  }

  /* 手臂摆动 */
  .arm-flail-l {
    animation: arm-l 0.7s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: right center;
  }
  @keyframes arm-l {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(-20deg); }
    50% { transform: rotate(0deg); }
    75% { transform: rotate(12deg); }
    100% { transform: rotate(0deg); }
  }
  .arm-flail-r {
    animation: arm-r 0.7s ease-in-out infinite;
    transform-box: fill-box;
    transform-origin: left center;
  }
  @keyframes arm-r {
    0% { transform: rotate(0deg); }
    25% { transform: rotate(20deg); }
    50% { transform: rotate(0deg); }
    75% { transform: rotate(-12deg); }
    100% { transform: rotate(0deg); }
  }


  /* 泪滴飞出 - 两侧交替 */
  .tear1 {
    animation: tear-fly1 0.8s ease-out infinite;
  }
  .tear2 {
    animation: tear-fly2 0.8s ease-out infinite;
    animation-delay: 0.3s;
  }
  .tear3 {
    animation: tear-fly1 0.8s ease-out infinite;
    animation-delay: 0.6s;
  }
  @keyframes tear-fly1 {
    0% { opacity: 0.8; transform: translate(0px, 0px); }
    100% { opacity: 0; transform: translate(-3px, 3px); }
  }
  @keyframes tear-fly2 {
    0% { opacity: 0.8; transform: translate(0px, 0px); }
    100% { opacity: 0; transform: translate(3px, 3px); }
  }

  /* 阴影 */
  .shadow-anim {
    animation: shadow-anim 3s ease-in-out infinite;
  }
  @keyframes shadow-anim {
    0% { transform: translateX(-4px); opacity: 0.45; }
    50% { transform: translateX(-7px); opacity: 0.45; }
    100% { transform: translateX(-4px); opacity: 0.45; }
  }
</style>

  <!-- 阴影 -->
  <g class="shadow-anim">
    <rect x="1" y="15" width="13" height="1" fill="#000000" opacity="0.5"/>
  </g>

  <!-- 水平滚动 -->
  <g class="roll-move">

    <!-- 泪滴 - 两侧飞出 -->
    <g class="tear1">
      <rect x="-1" y="5" width="0.8" height="1" fill="#4FC3F7"/>
    </g>
    <g class="tear2">
      <rect x="15" y="4.5" width="0.8" height="1" fill="#4FC3F7"/>
    </g>
    <g class="tear3">
      <rect x="-2" y="7" width="0.8" height="1" fill="#4FC3F7"/>
    </g>

    <!-- 位置补偿 -->
    <g class="fall-compensate">
    <!-- 倒立旋转 -->
    <g class="fall-rotate">
      <!-- 颤抖 -->
      <g class="body-shake">

        <!-- 腿部外侧 -->
        <g class="legs-kick-outer">
          <rect x="3" y="12" width="1" height="3" fill="#DE886D"/>
          <rect x="11" y="12" width="1" height="3" fill="#DE886D"/>
        </g>

        <!-- 腿部内侧 -->
        <g class="legs-kick-inner">
          <rect x="5" y="12" width="1" height="3" fill="#DE886D"/>
          <rect x="9" y="12" width="1" height="3" fill="#DE886D"/>
        </g>

        <!-- 躯干 -->
        <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

        <!-- 斗鸡眼 -->
        <g class="x-eyes">
          <polyline points="4.2,8.3 5.7,9 4.2,9.7" fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
          <polyline points="10.8,8.3 9.3,9 10.8,9.7" fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round"/>
        </g>

        <!-- 左臂 -->
        <g class="arm-flail-l">
          <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
        </g>

        <!-- 右臂 -->
        <g class="arm-flail-r">
          <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
        </g>

      </g>
    </g>
    </g>
  </g>

</svg>
