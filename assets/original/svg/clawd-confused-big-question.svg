<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Timeline (6s cycle):
        0-5%:   Clawd stands at ground, normal
        5-8%:   blink
        8-16%:  tilt head + squint (on ground)
        16-34%: ? springs up with bounce
        34-56%: hold at top (1.3s)
        56-64%: head straightens, blink
        64-80%: ? compresses back down
        80-100%: hold compressed
      */

      .big-question {
        transform-origin: 7.5px 18px;
        animation: big-q-spring 6s infinite ease-in-out;
      }
      .clawd-rise {
        transform-origin: 7.5px 15px;
        animation: clawd-rise 6s infinite ease-in-out;
      }
      .ground-shadow {
        transform-origin: 7.5px 18px;
        animation: ground-shadow 6s infinite ease-in-out;
      }
      .body-tilt {
        transform-origin: 7.5px 15px;
        animation: body-tilt 6s infinite ease-in-out;
      }
      .breathe {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }
      .eyes {
        transform-origin: 7.5px 9px;
        animation: eyes-react 6s infinite ease-in-out;
      }
      .shadow-anim {
        transform-origin: 7.5px 15.5px;
      }

      @keyframes big-q-spring {
        0%, 16%   { transform: scaleY(0.02); }
        30%       { transform: scaleY(1.1); }
        36%       { transform: scaleY(0.96); }
        40%, 56%  { transform: scaleY(1); }
        68%       { transform: scaleY(1.06); }
        80%, 100% { transform: scaleY(0.02); }
      }
      @keyframes clawd-rise {
        0%, 16%   { transform: translateY(2.7px); }
        30%       { transform: translateY(-14.6px); }
        36%       { transform: translateY(-12.4px); }
        40%, 56%  { transform: translateY(-13px); }
        68%       { transform: translateY(-14px); }
        80%, 100% { transform: translateY(2.7px); }
      }
      @keyframes ground-shadow {
        0%, 16%   { transform: scaleX(1.5); opacity: 0.45; }
        30%       { transform: scaleX(0.6); opacity: 0.2; }
        40%, 56%  { transform: scaleX(0.8); opacity: 0.3; }
        68%       { transform: scaleX(0.65); opacity: 0.22; }
        80%, 100% { transform: scaleX(1.5); opacity: 0.45; }
      }
      @keyframes body-tilt {
        0%, 5%    { transform: translate(0, 0) rotate(0deg); }
        10%, 56%  { transform: translate(-0.5px, 0) rotate(-6deg); }
        64%, 100% { transform: translate(0, 0) rotate(0deg); }
      }
      @keyframes breathe {
        0%, 100% { transform: scale(1, 1); }
        50% { transform: scale(1.02, 0.98) translate(0, 0.3px); }
      }
      @keyframes eyes-react {
        0%, 5%    { transform: scaleY(1); }
        7%, 8%    { transform: scaleY(0.1); }
        10%, 56%  { transform: scaleY(0.55); }
        60%, 61%  { transform: scaleY(0.1); }
        64%, 100% { transform: scaleY(1); }
      }
    </style>
  </defs>

  <!-- Ground shadow -->
  <rect class="ground-shadow" x="2" y="17.5" width="11" height="1" fill="#000000" opacity="0.45" rx="0.3"/>

  <!-- Large Question Mark -->
  <g class="big-question" fill="#4A90D9">
    <rect x="2.5" y="2" width="10" height="2.5" rx="0.5"/>
    <rect x="0.5" y="2" width="2.5" height="4" rx="0.5"/>
    <rect x="12" y="2" width="2.5" height="7" rx="0.5"/>
    <rect x="8" y="9" width="4" height="2.5" rx="0.5"/>
    <rect x="6" y="11" width="3" height="3.5" rx="0.5"/>
    <rect x="6.5" y="16" width="2" height="2" rx="0.8"/>
  </g>

  <!-- Clawd -->
  <g class="clawd-rise">
    <rect class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>
    <g fill="#DE886D">
      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>
      <rect x="9" y="11" width="1" height="4"/>
      <rect x="11" y="11" width="1" height="4"/>
    </g>
    <g class="body-tilt">
      <g class="breathe">
        <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
        <g class="eyes" fill="#000000">
          <rect x="4" y="8" width="1" height="2"/>
          <rect x="10" y="8" width="1" height="2"/>
        </g>
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>
    </g>
  </g>
</svg>
