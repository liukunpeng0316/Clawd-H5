<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Clawd with party hat, holding party popper.
        4s cycle: normal eyes + hold popper → blink → happy eyes + confetti burst → blink → back
      */

      .breathe {
        transform-origin: 7.5px 13px;
        animation: breathe 3.2s infinite ease-in-out;
      }

      /* Subtle body bob when confetti pops */
      .body-bob {
        transform-origin: 7.5px 15px;
        animation: body-bob 4s infinite ease-in-out;
      }

      /* Hat bounces slightly */
      .hat-bounce {
        transform-origin: 7.5px 6px;
        animation: hat-bounce 4s infinite ease-in-out;
      }

      /* Normal eyes: visible in first half */
      .eyes-normal {
        animation: eyes-normal-vis 4s infinite ease-in-out;
      }

      /* Happy eyes: visible in second half */
      .eyes-happy {
        opacity: 0;
        animation: eyes-happy-vis 4s infinite ease-in-out;
      }

      /* Left arm moves to front */
      .arm-l-hold {
        animation: arm-l-hold 4s infinite ease-in-out;
      }
      /* Right arm moves to front */
      .arm-r-hold {
        animation: arm-r-hold 4s infinite ease-in-out;
      }
      /* Popper moves independently to front position, then tilts on fire */
      .popper-move {
        animation: popper-move 4s infinite ease-in-out;
      }

      /* Confetti pieces: burst at pop moment */
      .conf-1 { opacity: 0; animation: conf-fly-1 4s infinite ease-out; }
      .conf-2 { opacity: 0; animation: conf-fly-2 4s infinite ease-out; }
      .conf-3 { opacity: 0; animation: conf-fly-3 4s infinite ease-out; }
      .conf-4 { opacity: 0; animation: conf-fly-4 4s infinite ease-out; }
      .conf-5 { opacity: 0; animation: conf-fly-5 4s infinite ease-out; }
      .conf-6 { opacity: 0; animation: conf-fly-6 4s infinite ease-out; }

      .shadow-anim {
        transform-origin: 7.5px 15.5px;
        animation: shadow-bob 4s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      @keyframes breathe {
        0%, 100% { transform: scale(1, 1); }
        50%      { transform: scale(1.02, 0.98) translate(0, 0.3px); }
      }

      /*
        Timeline:
        0-8%:   arms at side, popper at right side
        8-18%:  arms + popper move to front (simultaneously)
        18-35%: hold in front, normal eyes
        35-38%: blink transition
        38-42%: happy eyes, body pop, popper tilts + fires
        42-75%: confetti flying
        75-80%: blink back
        80-88%: arms + popper return to sides
        88-100%: idle
      */
      @keyframes body-bob {
        0%, 35%   { transform: translate(0, 0) scaleY(1) scaleX(1); }
        38%       { transform: translate(0, 0.5px) scaleY(0.94) scaleX(1.04); }
        42%       { transform: translate(0, -1.5px) scaleY(1.03) scaleX(0.98); }
        50%, 75%  { transform: translate(0, 0) scaleY(1) scaleX(1); }
        100%      { transform: translate(0, 0) scaleY(1) scaleX(1); }
      }

      @keyframes hat-bounce {
        0%, 35%   { transform: translate(0, 0); }
        42%       { transform: translate(0, -1px); }
        50%, 100% { transform: translate(0, 0); }
      }

      @keyframes eyes-normal-vis {
        0%, 33%   { opacity: 1; }
        36%, 81%  { opacity: 0; }
        84%, 100% { opacity: 1; }
      }

      @keyframes eyes-happy-vis {
        0%, 35%   { opacity: 0; }
        40%, 79%  { opacity: 1; }
        83%, 100% { opacity: 0; }
      }

      /* Left arm: side → front (center-left) */
      @keyframes arm-l-hold {
        0%, 8%    { transform: translate(0, 0); }
        18%, 80%  { transform: translate(6px, 1px); }
        88%, 100% { transform: translate(0, 0); }
      }
      /* Right arm: side → front (center-right) */
      @keyframes arm-r-hold {
        0%, 8%    { transform: translate(0, 0); }
        18%, 80%  { transform: translate(-4px, 1px); }
        88%, 100% { transform: translate(0, 0); }
      }

      /*
        Popper: starts at right hand (14, 6.5), moves to front center (9, 8),
        tilts on fire, then returns.
        At rest: translate(0,0) = positioned at its base coords (14, 6.5).
        At front: translate(-5, 1.5) = positioned at (9, 8).
      */
      @keyframes popper-move {
        0%, 8%    { transform: translate(0, 0) rotate(0deg); }
        18%, 35%  { transform: translate(-5px, 1.5px) rotate(0deg); }
        38%, 50%  { transform: translate(-3.5px, -2px) rotate(10deg); }
        60%, 80%  { transform: translate(-5px, 1.5px) rotate(0deg); }
        88%, 100% { transform: translate(0, 0) rotate(0deg); }
      }

      /* Confetti fans out toward upper-right from popper front position (9, 7) */
      @keyframes conf-fly-1 {
        0%, 38%  { opacity: 0; transform: translate(0, 0); }
        42%      { opacity: 1; transform: translate(2px, -3px) rotate(40deg); }
        65%      { opacity: 1; transform: translate(7px, -10px) rotate(200deg); }
        85%      { opacity: 0; transform: translate(9px, -13px) rotate(360deg); }
        100%     { opacity: 0; }
      }
      @keyframes conf-fly-2 {
        0%, 39%  { opacity: 0; transform: translate(0, 0); }
        43%      { opacity: 1; transform: translate(3px, -2px) rotate(-30deg); }
        65%      { opacity: 1; transform: translate(9px, -7px) rotate(-180deg); }
        85%      { opacity: 0; transform: translate(12px, -9px) rotate(-340deg); }
        100%     { opacity: 0; }
      }
      @keyframes conf-fly-3 {
        0%, 40%  { opacity: 0; transform: translate(0, 0); }
        44%      { opacity: 1; transform: translate(1px, -4px) rotate(50deg); }
        65%      { opacity: 1; transform: translate(3px, -13px) rotate(220deg); }
        85%      { opacity: 0; transform: translate(4px, -16px) rotate(400deg); }
        100%     { opacity: 0; }
      }
      @keyframes conf-fly-4 {
        0%, 38%  { opacity: 0; transform: translate(0, 0); }
        42%      { opacity: 1; transform: translate(4px, -1.5px) rotate(-60deg); }
        65%      { opacity: 1; transform: translate(11px, -5px) rotate(-240deg); }
        85%      { opacity: 0; transform: translate(14px, -6px) rotate(-400deg); }
        100%     { opacity: 0; }
      }
      @keyframes conf-fly-5 {
        0%, 40%  { opacity: 0; transform: translate(0, 0); }
        44%      { opacity: 1; transform: translate(1.5px, -4.5px) rotate(70deg); }
        65%      { opacity: 1; transform: translate(5px, -14px) rotate(250deg); }
        85%      { opacity: 0; transform: translate(6.5px, -17px) rotate(420deg); }
        100%     { opacity: 0; }
      }
      @keyframes conf-fly-6 {
        0%, 39%  { opacity: 0; transform: translate(0, 0); }
        43%      { opacity: 1; transform: translate(3.5px, -3px) rotate(-45deg); }
        65%      { opacity: 1; transform: translate(10px, -9px) rotate(-210deg); }
        85%      { opacity: 0; transform: translate(13px, -11px) rotate(-380deg); }
        100%     { opacity: 0; }
      }

      @keyframes shadow-bob {
        0%, 35%   { transform: scaleX(1); opacity: 0.5; }
        38%       { transform: scaleX(1.05); opacity: 0.52; }
        42%       { transform: scaleX(0.92); opacity: 0.4; }
        50%, 100% { transform: scaleX(1); opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-anim" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Body bob group -->
  <g class="body-bob">
    <!-- Legs -->
    <g fill="#DE886D">
      <rect x="3" y="11" width="1" height="4"/>
      <rect x="5" y="11" width="1" height="4"/>
      <rect x="9" y="11" width="1" height="4"/>
      <rect x="11" y="11" width="1" height="4"/>
    </g>

    <g class="breathe">
      <!-- Torso -->
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

      <!-- Normal eyes -->
      <g class="eyes-normal" fill="#000000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>

      <!-- Happy eyes ^^ -->
      <g class="eyes-happy" fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="3.5,9.5 4.5,8 5.5,9.5"/>
        <polyline points="9.5,9.5 10.5,8 11.5,9.5"/>
      </g>

      <!-- Left arm (moves to front) -->
      <g class="arm-l-hold">
        <rect x="0.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.2"/>
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>

      <!-- Right arm (moves to front) -->
      <g class="arm-r-hold">
        <rect x="13.5" y="9.5" width="2" height="2" fill="#000000" opacity="0.2"/>
        <rect x="13" y="9" width="2" height="2" fill="#DE886D"/>
      </g>

      <!-- Party popper (independent animation, drawn on top of right arm) -->
      <!-- Base position: (14, 6.5), red cone 1x3 pointing up -->
      <g class="popper-move">
        <rect x="13.5" y="6.5" width="1" height="3" rx="0.2" fill="#FF5252"/>
        <rect x="13.5" y="6.5" width="1" height="0.5" rx="0.2" fill="#FFD54F"/>
        <rect x="13.3" y="6" width="1.4" height="0.6" rx="0.15" fill="#4FC3F7"/>
      </g>

      <!-- Party hat (pixel cone, smaller, shifted left) -->
      <g class="hat-bounce">
        <g transform="translate(6, 6) rotate(-10) scale(0.7)">
          <rect x="-4" y="-1" width="8" height="1" fill="#FF5252"/>
          <rect x="-3.5" y="-2" width="7" height="1" fill="#4FC3F7"/>
          <rect x="-3" y="-3" width="6" height="1" fill="#FFD54F"/>
          <rect x="-2.5" y="-4" width="5" height="1" fill="#FF5252"/>
          <rect x="-2" y="-5" width="4" height="1" fill="#4FC3F7"/>
          <rect x="-1.5" y="-6" width="3" height="1" fill="#FFD54F"/>
          <rect x="-1" y="-7" width="2" height="1" fill="#FF5252"/>
          <rect x="-0.6" y="-7.8" width="1.2" height="1.2" rx="0.5" fill="#FFD54F"/>
        </g>
      </g>
    </g>
  </g>

  <!-- Confetti pieces (spawn from popper front position ~9, 6.5) -->
  <g transform="translate(9, 6.5)">
    <g class="conf-1">
      <rect x="0" y="0" width="0.8" height="0.8" fill="#F06292"/>
    </g>
  </g>
  <g transform="translate(9, 6.5)">
    <g class="conf-2">
      <rect x="0" y="0" width="0.7" height="0.7" fill="#4FC3F7"/>
    </g>
  </g>
  <g transform="translate(9, 6.5)">
    <g class="conf-3">
      <rect x="0" y="0" width="0.9" height="0.5" fill="#FFD54F"/>
    </g>
  </g>
  <g transform="translate(9, 6.5)">
    <g class="conf-4">
      <rect x="0" y="0" width="0.6" height="0.9" fill="#81C784"/>
    </g>
  </g>
  <g transform="translate(9, 6.5)">
    <g class="conf-5">
      <rect x="0" y="0" width="0.8" height="0.6" fill="#BA68C8"/>
    </g>
  </g>
  <g transform="translate(9, 6.5)">
    <g class="conf-6">
      <rect x="0" y="0" width="0.7" height="0.8" fill="#FF8A65"/>
    </g>
  </g>
</svg>
