<svg xmlns="http://www.w3.org/2000/svg" viewBox="-15 -25 45 45" width="500" height="500">
  <defs>
    <style>
      /*
        Gloomy crawl: 6s full cycle
        0-5%:    at left, pause
        5-45%:   crawl right (translate -4px to +4px)
        45-55%:  at right, pause + turn
        55-95%:  crawl left (translate +4px to -4px)
        95-100%: at left, pause + turn
      */

      /* Body horizontal crawl: synced with 0.5s leg step */
      .crawl-body {
        transform-origin: 7.5px 13px;
        animation: crawl-move 0.5s infinite ease-in-out;
      }

      /* Legs: outer pair vs inner pair, slow stepping */
      .leg-outer {
        animation: step-outer 0.5s infinite ease-in-out;
      }
      .leg-inner {
        animation: step-inner 0.5s infinite ease-in-out;
      }

      /* Arms: static, no swing */

      /* Eyes: static dead-fish stare */

      /* Dark aura particles */
      .aura {
        opacity: 0;
        animation: aura-rise 2.5s infinite ease-out;
      }

      /* Shadow follows body */
      .shadow-crawl {
        transform-box: fill-box;
        transform-origin: 50% 50%;
        animation: shadow-move 0.5s infinite ease-in-out;
      }

      /* --- Keyframes --- */

      @keyframes crawl-move {
        0%, 100% { transform: translate(-0.7px, 0); }
        50%      { transform: translate(0.7px, 0); }
      }

      /* Outer legs (3,11): up when inner down */
      @keyframes step-outer {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-1.2px); }
      }

      /* Inner legs (5,9): opposite phase */
      @keyframes step-inner {
        0%, 100% { transform: translateY(-1.2px); }
        50%      { transform: translateY(0); }
      }

      /* arm swings removed: arms static */

      /* Eyes: look toward movement, tiny + depressed */
      /* eyes-look removed: fully static */

      /* Dark aura: rise up + fade. Peak opacity must exceed GIF threshold
         (group opacity 1.0 x anim 0.8 = 0.8, alpha 204 > 128) */
      @keyframes aura-rise {
        0%   { opacity: 0; transform: translateY(0) scale(0.6); }
        15%  { opacity: 0.8; transform: translateY(-1px) scale(0.8); }
        50%  { opacity: 0.5; transform: translateY(-5px) scale(1); }
        100% { opacity: 0; transform: translateY(-10px) scale(1.3); }
      }

      /* Shadow follows body horizontally */
      @keyframes shadow-move {
        0%, 100% { transform: translateX(-0.7px); opacity: 0.5; }
        50%      { transform: translateX(0.7px); opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Ground Shadow -->
  <rect class="shadow-crawl" x="3" y="15" width="9" height="1" fill="#000000" opacity="0.5"/>

  <!-- Dark aura particles -->
  <g class="crawl-body">
    <g fill="#4A148C">
      <rect class="aura" x="-2" y="5" width="1.5" height="1.5" style="animation-delay: 0s;"/>
      <rect class="aura" x="16" y="7" width="1.2" height="1.2" style="animation-delay: 0.5s;"/>
      <rect class="aura" x="5" y="4" width="1" height="1" style="animation-delay: 1.0s;"/>
      <rect class="aura" x="12" y="3" width="1.3" height="1.3" style="animation-delay: 1.5s;"/>
      <rect class="aura" x="0" y="10" width="1" height="1" style="animation-delay: 2.0s;"/>
      <rect class="aura" x="8" y="2" width="1.5" height="1.5" style="animation-delay: 0.8s;"/>
      <rect class="aura" x="14" y="11" width="1.2" height="1.2" style="animation-delay: 1.3s;"/>
      <rect class="aura" x="3" y="8" width="1" height="1" style="animation-delay: 1.8s;"/>
    </g>
  </g>

  <!-- Full body: horizontal movement -->
  <g class="crawl-body">
      <!-- Legs (slow alternating step, stubby) -->
      <g fill="#DE886D">
        <rect class="leg-outer" x="2" y="12" width="1" height="3"/>
        <rect class="leg-inner" x="4" y="12" width="1" height="3"/>
        <rect class="leg-inner" x="10" y="12" width="1" height="3"/>
        <rect class="leg-outer" x="12" y="12" width="1" height="3"/>
      </g>

      <!-- Torso: squished wide, slightly taller -->
      <rect x="1" y="7" width="13" height="6" fill="#DE886D"/>

      <!-- Eyes: wide 2x1 dead-fish eyes, completely static -->
      <g fill="#000000">
        <rect x="3" y="9.5" width="2" height="1"/>
        <rect x="10" y="9.5" width="2" height="1"/>
      </g>

      <!-- Arms: static at sides of wide body -->
      <rect x="-1" y="10" width="2" height="2" fill="#DE886D"/>
      <rect x="14" y="10" width="2" height="2" fill="#DE886D"/>
  </g>
</svg>
